id: fact_check
name: Fact Check
description: Verify a claim against primary sources and write a verdict artifact with citations and confidence level. Pass the claim in context.task.
version: "1.0"

budget:
  # Checking against primary sources means fetching whole pages, and every step re-sends them: one two-claim check on
  # 24 Oct 2026 used 77k tokens (73k of it input). Research is 250k.
  maxTokens: 200000
  maxCostUsd: 1.00
  timeoutSeconds: 600
  onExceed: abort

steps:
  - id: orchestrate
    type: spawn_agent
    name: Orchestrate verification
    agentRole: orchestrator
    outputKey: orchestrator_result
