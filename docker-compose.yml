# Mission Control gateway
#
# Usage:
#   docker compose up --build   # first run or after code changes
#   docker compose up -d        # background
#   docker compose logs -f      # stream logs
#   docker compose down         # stop + remove container
#
# The frontend (Vite) runs natively alongside this — cd app && npm run dev
#
# network_mode: host lets the container share WSL's network namespace.
# In WSL2 mirrored mode, WSL's 127.0.0.1 reaches Windows services directly,
# so LOCAL_PROVIDER_URL (whatever you set in gateway/.env: LM Studio's 1234,
# Ollama's 11434, or llama.cpp's 8080) reaches the Windows-side server as-is.
# Port 4747 binds on the WSL host's loopback and is reachable from Windows as localhost.
# No Windows Firewall rules or LAN exposure needed.

services:
  gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    network_mode: host
    environment:
      # Loopback by default: the gateway is reachable only from this machine (and from Windows
      # through WSL2 localhost forwarding). Every connection is also gated by Origin validation
      # and a required token (see gateway/src/auth.ts), but a port that is not on the network
      # cannot be probed from it in the first place.
      # To open it to your LAN, set GATEWAY_HOST=0.0.0.0 in your shell (or in a .env file next
      # to this docker-compose.yml) before `docker compose up`. Only do that on a network you trust,
      # and list the address other machines will use in GATEWAY_ALLOWED_HOSTS (e.g. 192.168.4.29):
      # requests naming any other host are refused.
      GATEWAY_HOST: "${GATEWAY_HOST:-127.0.0.1}"
      GATEWAY_ALLOWED_HOSTS: "${GATEWAY_ALLOWED_HOSTS:-}"
      # LOCAL_PROVIDER_URL is deliberately NOT set here. Docker Compose's `environment:`
      # would override `env_file:`, silently blocking the value the user sets in
      # gateway/.env. Leave it to env_file so the user's choice (LM Studio, Ollama,
      # llama.cpp, or a custom port) takes effect.
    # Run as the host user so volume-mounted files are writable.
    # UID 1000 is the first regular user on Ubuntu.
    user: "1000:1000"
    env_file:
      # Loads APPROVAL_SECRET, OPENROUTER_API_KEY, DEFAULT_MODEL, etc.
      # GATEWAY_HOST above takes priority over any GATEWAY_HOST entry in this file.
      - ./gateway/.env
    volumes:
      # Persistent data: SQLite DB, auth token, config.
      # node:22-alpine ships with a 'node' user at UID 1000 — homedir() resolves to /home/node.
      - "${HOME}/.missioncontrol:/home/node/.missioncontrol"
      # Agent workspace — needed for file_read/write/edit tools.
      - "${HOME}/mission-control:/home/node/mission-control"
    restart: unless-stopped
