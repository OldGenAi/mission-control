# Monthly pull requests for dependency updates, one per folder, so each goes through the normal review and audit before
# it is merged. Only releases at least two weeks old are offered (cooldown), so a bad release has time to be noticed.
version: 2
updates:
  - package-ecosystem: npm
    directory: /gateway
    schedule:
      interval: monthly
    cooldown:
      default-days: 14
    groups:
      gateway:
        patterns: ["*"]
    open-pull-requests-limit: 2

  - package-ecosystem: npm
    directory: /app
    schedule:
      interval: monthly
    cooldown:
      default-days: 14
    groups:
      app:
        patterns: ["*"]
    open-pull-requests-limit: 2

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 14
    groups:
      actions:
        patterns: ["*"]
