# Builds the ready-to-run packages (one per system), proves each one starts on its own
# system, and for a version tag publishes them as a DRAFT release with checksums and
# build provenance. A person reads the draft and presses Publish; nothing goes out by itself.
# Run it by hand (Actions > Release > Run workflow) to get the packages as build artifacts only.
#
# Third-party actions are pinned to full commit SHAs (tag in the comment): this workflow can
# write releases, so a moved tag must not be able to change what runs here.
name: Release

on:
  push:
    tags: ["v*"]
  # A change to the packaging itself is proven on all four systems before it merges.
  pull_request:
    paths: ["release/**", ".github/workflows/release.yml", "install.sh", "install.ps1", "gateway/src/cli/**", "gateway/src/install/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    name: Package (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, platform: linux-x64 }
          - { os: ubuntu-24.04-arm, platform: linux-arm64 }
          - { os: macos-latest, platform: darwin-arm64 }
          - { os: windows-latest, platform: win-x64 }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            gateway/package-lock.json
            app/package-lock.json
      - name: Build gateway
        working-directory: gateway
        run: npm ci --no-audit --no-fund && npm run build && npm test
      - name: Build UI
        working-directory: app
        run: npm ci --no-audit --no-fund && npm run build
      - name: Package
        run: |
          version="${GITHUB_REF_NAME#v}"
          [ "$GITHUB_REF_TYPE" = tag ] || version="0.0.0-dev.${GITHUB_SHA::7}"
          node release/build-package.mjs --platform "${{ matrix.platform }}" --version "$version"
      - name: Smoke test
        run: node release/smoke-test.mjs release/out/mission-control-*-${{ matrix.platform }}.${{ runner.os == 'Windows' && 'zip' || 'tar.gz' }}
      # The real installers, run the way a user would (icons and PATH included), against the
      # package just built. CI machines are thrown away afterwards.
      - name: Install test (Linux and macOS)
        if: runner.os != 'Windows'
        run: |
          from="$RUNNER_TEMP/install-from"
          mkdir -p "$from"
          cp release/out/*-${{ matrix.platform }}.tar.gz "$from/"
          cat release/out/*.sha256 > "$from/SHA256SUMS"
          MC_INSTALL_FROM="$from" MC_NO_OPEN=1 sh ./install.sh
          "$HOME/.local/bin/mc" start
          "$HOME/.local/bin/mc" doctor
          "$HOME/.missioncontrol/app/bin/mc-stop"
          if [ "$RUNNER_OS" = macOS ]; then
            test -d "$HOME/Desktop/Mission Control.app" && test -d "$HOME/Desktop/Stop Mission Control.app"
          else
            test -f "$HOME/.local/share/applications/mission-control.desktop" && test -f "$HOME/.local/share/applications/stop-mission-control.desktop"
          fi
          "$HOME/.local/bin/mc" uninstall
          test ! -e "$HOME/.missioncontrol/app" && test ! -e "$HOME/.local/bin/mc"
          test ! -e "$HOME/Desktop/Mission Control.app" && test ! -e "$HOME/.local/share/applications/mission-control.desktop"
          test -f "$HOME/.missioncontrol/config.json"   # data kept
      - name: Install test (Windows)
        if: runner.os == 'Windows'
        # Windows PowerShell 5.1: what most people will paste the one line into.
        shell: powershell
        run: |
          $from = Join-Path $env:RUNNER_TEMP 'install-from'
          New-Item -ItemType Directory -Force $from | Out-Null
          Copy-Item release/out/*-win-x64.zip $from
          Get-Content release/out/*.sha256 | Set-Content -Encoding ascii (Join-Path $from 'SHA256SUMS')
          $env:MC_INSTALL_FROM = $from
          $env:MC_NO_OPEN = '1'
          ./install.ps1
          $bin = Join-Path $env:USERPROFILE '.missioncontrol\app\bin'
          & (Join-Path $bin 'mc.cmd') start
          if ($LASTEXITCODE -ne 0) { throw 'mc start failed' }
          & (Join-Path $bin 'mc.cmd') doctor
          & (Join-Path $bin 'mc-stop.cmd')
          if ($LASTEXITCODE -ne 0) { throw 'mc stop failed' }
          $desktop = [Environment]::GetFolderPath('Desktop')
          foreach ($icon in 'Mission Control.lnk', 'Stop Mission Control.lnk') {
            if (-not (Test-Path (Join-Path $desktop $icon))) { throw "desktop icon missing: $icon" }
          }
          if (-not (([Environment]::GetEnvironmentVariable('Path', 'User') -split ';') -contains $bin)) { throw 'PATH not updated' }
          & (Join-Path $bin 'mc.cmd') uninstall
          if ($LASTEXITCODE -ne 0) { throw 'mc uninstall failed' }
          Start-Sleep -Seconds 6
          if (Test-Path (Join-Path $env:USERPROFILE '.missioncontrol\app')) { throw 'app folder still there after uninstall' }
          foreach ($icon in 'Mission Control.lnk', 'Stop Mission Control.lnk') {
            if (Test-Path (Join-Path $desktop $icon)) { throw "desktop icon still there: $icon" }
          }
          if (([Environment]::GetEnvironmentVariable('Path', 'User') -split ';') -contains $bin) { throw 'PATH entry still there' }
          if (-not (Test-Path (Join-Path $env:USERPROFILE '.missioncontrol\config.json'))) { throw 'data folder was removed' }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package-${{ matrix.platform }}
          path: |
            release/out/*.tar.gz
            release/out/*.zip
            release/out/*.sha256
          if-no-files-found: error

  draft-release:
    name: Draft release
    if: github.ref_type == 'tag'
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write        # create the draft release
      id-token: write        # sign the provenance attestation
      attestations: write    # store it
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: package-*
          merge-multiple: true
          path: dist
      - name: Checksums
        working-directory: dist
        run: cat *.sha256 > SHA256SUMS && rm *.sha256 && cat SHA256SUMS
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --draft --verify-tag --title "Mission Control $GITHUB_REF_NAME" --generate-notes
