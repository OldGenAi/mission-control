# Runs the checks on Linux, macOS and Windows for every push and pull request, and once a night
# (a dependency can break the build overnight with no change here). The matrix exists because the
# test suite was once Linux-only and a macOS bug (a workspace behind a symlink) went unnoticed.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gateway:
    name: Gateway (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22]
        include:
          # Newer Node is informational: it shows breakage early without blocking a merge.
          - os: ubuntu-latest
            node: 24
            experimental: true
    continue-on-error: ${{ matrix.experimental == true }}
    defaults:
      run:
        shell: bash
        working-directory: gateway
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: gateway/package-lock.json
      # npm scripts run in cmd.exe on Windows here, as they do for users: they must not need a Unix shell.
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run build
      - run: npm test

  app:
    name: App (ubuntu-latest, Node 22)
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run build

  # The one-line installers run on strangers' machines: lint them on every change.
  installers:
    name: Installer lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck --shell=sh install.sh
      - shell: pwsh
        run: |
          Install-Module PSScriptAnalyzer -RequiredVersion 1.23.0 -Scope CurrentUser -Force
          $problems = Invoke-ScriptAnalyzer -Path install.ps1 -Severity Error
          $problems | Format-Table -AutoSize
          if ($problems) { throw "install.ps1 has $(@($problems).Count) error(s)" }

  # Every run, not just nightly: a pull request must not merge with a known high-severity
  # advisory in a shipped dependency (dev-only tools are left out with --omit=dev).
  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The registry's audit endpoint sometimes hangs for minutes: give each try 90 s and make up to 3 tries.
      # A real advisory still fails all three, so a vulnerable dependency cannot slip through.
      - run: |
          for try in 1 2 3; do
            timeout 90 npm audit --omit=dev --audit-level=high && exit 0
            echo "audit try $try failed"
          done
          exit 1
        working-directory: gateway
      - run: |
          for try in 1 2 3; do
            timeout 90 npm audit --omit=dev --audit-level=high && exit 0
            echo "audit try $try failed"
          done
          exit 1
        working-directory: app
