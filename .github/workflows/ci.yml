# Runs the checks on Linux, macOS and Windows for every push and pull request, and once a night
# (a dependency can break the build overnight with no change here). The matrix exists because the
# test suite was once Linux-only and a macOS bug (a workspace behind a symlink) went unnoticed.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gateway:
    name: Gateway (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22]
        include:
          # Newer Node is informational: better-sqlite3 9.x does not build on it yet, and this shows when that changes.
          - os: ubuntu-latest
            node: 24
            experimental: true
    continue-on-error: ${{ matrix.experimental == true }}
    defaults:
      run:
        shell: bash
        working-directory: gateway
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: gateway/package-lock.json
      # The build script uses mkdir -p and cp, and the test script a glob; Windows runs npm scripts
      # in cmd.exe by default, so point npm at Git Bash there (the runner has it).
      - if: runner.os == 'Windows'
        run: npm config set script-shell "C:\\Program Files\\Git\\bin\\bash.exe"
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run build
      - run: npm test

  app:
    name: App (ubuntu-latest, Node 22)
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run build

  audit:
    name: Dependency audit
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm audit --omit=dev --audit-level=high
        working-directory: gateway
      - run: npm audit --omit=dev --audit-level=high
        working-directory: app
